<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form - WDD 131</title>
    <meta name="description" content="Comprehensive product review form for the WDD 131 Web Frontend Development course at BYU-Idaho.">
    <meta name="author" content="Samanya Immanuel">
    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>
<body>
    <header>
        <h1>Product Review</h1>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>
            <li><a href="form.html">Review Form</a></li>
            <li><a href="#" aria-label="Reference Page">References</a></li>
        </ul>
    </nav>

    <main>
        <form method="get" action="review.html">
            <div class="form-group">
                <label for="product-name">Product Name</label>
                <select id="product-name" name="productName" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>
            </div>

            <div class="form-group">
                <label>Overall Rating</label>
                <div class="rating-container">
                    <label class="radio-label" for="rating-1">
                        <span class="stars" aria-hidden="true">☆</span>
                        <input type="radio" id="rating-1" name="overallRating" value="1" required aria-label="1 star">
                    </label>
                    <label class="radio-label" for="rating-2">
                        <span class="stars" aria-hidden="true">☆☆</span>
                        <input type="radio" id="rating-2" name="overallRating" value="2" required aria-label="2 stars">
                    </label>
                    <label class="radio-label" for="rating-3">
                        <span class="stars" aria-hidden="true">☆☆☆</span>
                        <input type="radio" id="rating-3" name="overallRating" value="3" required aria-label="3 stars">
                    </label>
                    <label class="radio-label" for="rating-4">
                        <span class="stars" aria-hidden="true">☆☆☆☆</span>
                        <input type="radio" id="rating-4" name="overallRating" value="4" required aria-label="4 stars">
                    </label>
                    <label class="radio-label" for="rating-5">
                        <span class="stars" aria-hidden="true">☆☆☆☆☆</span>
                        <input type="radio" id="rating-5" name="overallRating" value="5" required aria-label="5 stars">
                    </label>
                </div>
            </div>

            <div class="form-group">
                <label for="install-date">Date of Installation</label>
                <input type="date" id="install-date" name="installDate" required>
            </div>

            <div class="form-group">
                <label>Which features did you find useful? <span class="subtext">(Check all that apply)</span></label>
                <div class="checkbox-group">
                    <label for="feat-durability"><input type="checkbox" id="feat-durability" name="features" value="durability"> Durability</label>
                    <label for="feat-ease"><input type="checkbox" id="feat-ease" name="features" value="ease-of-use"> Ease of Use</label>
                    <label for="feat-perf"><input type="checkbox" id="feat-perf" name="features" value="performance"> Performance</label>
                    <label for="feat-design"><input type="checkbox" id="feat-design" name="features" value="design"> Design</label>
                </div>
            </div>

            <div class="form-group">
                <label for="written-review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="written-review" name="writtenReview" rows="5"></textarea>
            </div>

            <div class="form-group">
                <label for="user-name">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="user-name" name="userName">
            </div>

            <input type="submit" value="Post Review" class="submit-btn">
        </form>
    </main>

    <footer>
        <p>&copy;<span id="currentyear"></span> 🌺 Samanya Immanuel 🌺 Uganda</p>
        <p id="lastModified"></p>
    </footer>
</body>
</html>
